<text x="630" y="344" text-anchor="middle" fill="#86efac" font-size="9.0" class="mono-whisper">v = 9 (1 prism → F₃²)   ·   v = 243 (10 Golay prisms → F₃⁵)</text>
<text x="630" y="362" text-anchor="middle" fill="#8b949e" font-size="8" class="mono-whisper">Antipodal pairs ±cᵢ generate an elementary abelian 3-group F₃ⁿ</text>
<text x="1060" y="88" text-anchor="middle" fill="#f4f4f5" font-size="13.5" class="poetic-title">III · Non-Closure at v = 99 → Seed Dodecagon C₁₂</text>
