<text x="640" y="34" text-anchor="middle" fill="#f4f4f5" font-size="18.5" class="poetic-title">Master Theorem IV — Triangle-Core Seed V₃ₖ₋₃, the 3₃ Prism Closure Dichotomy &amp; Seed Dodecagon C₁₂</text>
<text x="640" y="54" text-anchor="middle" fill="#8b949e" font-size="9" class="mono-whisper">V_seed = T ⊔ S₀ ⊔ S₁ ⊔ S₂ (|V_seed| = 3k - 3)   ·   t_trans = k - 2 transversal triangles   ·   3₃ Prism Closure ⟺ v ∈ {9, 243}</text>
