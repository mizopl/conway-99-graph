<text x="635.0" y="88" text-anchor="middle" fill="#854d0e" font-size="13.5" class="poetic-title">v = 99 · No Cayley</text>
<text x="635.0" y="104" text-anchor="middle" fill="#71717a" font-size="8.0" class="mono-whisper">99 = 3² × 11  (k = 14)</text>
<text x="635.0" y="146" text-anchor="middle" fill="#18181b" font-size="8.4" class="mono-whisper">Sylow: n₁₁ = n₃ = 1</text>
<text x="635.0" y="162" text-anchor="middle" fill="#71717a" font-size="8.0" class="mono-whisper">H ≅ P₉ × C₁₁ ↠ Q = C₃ × C₁₁</text>
<line x1="550.0" y1="180" x2="720.0" y2="180" stroke="#d4d4d8" stroke-width="0.6"/>
<text x="635.0" y="202" text-anchor="middle" fill="#18181b" font-size="8.2" class="mono-whisper">1. Order-3 bound (Thm 41):</text>
<text x="635.0" y="218" text-anchor="middle" fill="#9f1239" font-size="8.4" class="mono-whisper">k = 14 &gt; 3² - 1 = 8</text>
<text x="635.0" y="248" text-anchor="middle" fill="#18181b" font-size="8.2" class="mono-whisper">2. C₃ × C₁₁ Fourier (Thm 42):</text>
<text x="635.0" y="264" text-anchor="middle" fill="#3f3f46" font-size="8.0" class="mono-whisper">33·n₁,₁ = 14 - ε₃ - ε₁₁ + ε₃₃</text>
<text x="635.0" y="282" text-anchor="middle" fill="#9f1239" font-size="8.4" class="mono-whisper">33·n₁,₁ ∈ {7, 14, 21, 28}</text>
<text x="635.0" y="302" text-anchor="middle" fill="#71717a" font-size="7.8" class="mono-whisper">33 ∤ RHS for all εᵢ ∈ {3, -4}</text>
<text x="635.0" y="352" text-anchor="middle" fill="#9f1239" font-size="8.5" class="mono-whisper">✗ NO GROUP H OF ORDER 99</text>
<text x="895.0" y="88" text-anchor="middle" fill="#18181b" font-size="13.5" class="poetic-title">v = 6,273 · No Cayley</text>
<text x="895.0" y="104" text-anchor="middle" fill="#71717a" font-size="8.0" class="mono-whisper">6,273 = 3² × 17 × 41  (k = 112)</text>
<text x="895.0" y="146" text-anchor="middle" fill="#18181b" font-size="8.4" class="mono-whisper">Sylow: n₄₁ = 1, gcd(153,40)=1</text>
<text x="895.0" y="162" text-anchor="middle" fill="#71717a" font-size="8.0" class="mono-whisper">Central quotient H ↠ C₄₁</text>
<line x1="810.0" y1="180" x2="980.0" y2="180" stroke="#d4d4d8" stroke-width="0.6"/>
<text x="895.0" y="202" text-anchor="middle" fill="#18181b" font-size="8.2" class="mono-whisper">Galois on C₄₁ (θ ∈ {10, -11}):</text>
<text x="895.0" y="220" text-anchor="middle" fill="#3f3f46" font-size="8.2" class="mono-whisper">n₀ + 40·n_* = 112</text>
<text x="895.0" y="236" text-anchor="middle" fill="#3f3f46" font-size="8.2" class="mono-whisper">n₀ - n_* = ε₄₁ ∈ {10, -11}</text>
<text x="895.0" y="258" text-anchor="middle" fill="#18181b" font-size="8.2" class="mono-whisper">⟹ 41·n_* = 123 ⟹ n_* = 3</text>
<text x="895.0" y="282" text-anchor="middle" fill="#9f1239" font-size="9.0" class="mono-whisper">n₀ = -11 + 3 = -8 &lt; 0 !</text>
<text x="895.0" y="302" text-anchor="middle" fill="#71717a" font-size="7.8" class="mono-whisper">Negative fiber multiplicity</text>
<text x="895.0" y="352" text-anchor="middle" fill="#9f1239" font-size="8.5" class="mono-whisper">✗ NO GROUP H OF ORDER 6,273</text>
<text x="1145.0" y="88" text-anchor="middle" fill="#18181b" font-size="13.5" class="poetic-title">v = 494,019 · No Cayley</text>
<text x="1145.0" y="104" text-anchor="middle" fill="#71717a" font-size="8.0" class="mono-whisper">3⁵ × 19 × 107  (k = 994)</text>
<text x="1145.0" y="146" text-anchor="middle" fill="#18181b" font-size="8.4" class="mono-whisper">Sylow: n₁₀₇ = 1, n₁₉ = 1</text>
<text x="1145.0" y="162" text-anchor="middle" fill="#71717a" font-size="7.8" class="mono-whisper">Q = (C₁₉ ⋊ C_d) × C₁₀₇ (d ∈ {1,3,9})</text>
<line x1="1060.0" y1="180" x2="1230.0" y2="180" stroke="#d4d4d8" stroke-width="0.6"/>
<text x="1145.0" y="202" text-anchor="middle" fill="#18181b" font-size="8.0" class="mono-whisper">C₁₀₇ fiber: n_* = 9, s₁ = 9/d ∈ {9,3,1}</text>
<text x="1145.0" y="222" text-anchor="middle" fill="#18181b" font-size="8.0" class="mono-whisper">Induced C₁₉-character trace:</text>
<text x="1145.0" y="242" text-anchor="middle" fill="#3f3f46" font-size="8.0" class="mono-whisper">107(19·u₁ - s₁) = 63(m₁ - m₀)</text>
<text x="1145.0" y="260" text-anchor="middle" fill="#71717a" font-size="7.8" class="mono-whisper">|m₁ - m₀| ≤ 18 &lt; 107 ⟹ m₁ = m₀</text>
<text x="1145.0" y="282" text-anchor="middle" fill="#9f1239" font-size="9.0" class="mono-whisper">19·u₁ = s₁ ∈ {9, 3, 1} !</text>
<text x="1145.0" y="302" text-anchor="middle" fill="#71717a" font-size="7.8" class="mono-whisper">19 ∤ 9, 3, 1 (abelian &amp; non-abelian)</text>
<text x="1145.0" y="352" text-anchor="middle" fill="#9f1239" font-size="8.5" class="mono-whisper">✗ NO GROUP H OF ORDER 494,019</text>
