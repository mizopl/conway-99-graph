<text x="625" y="88" text-anchor="middle" fill="#18181b" font-size="13.5" class="poetic-title">II · The N₁(F) No-Orbital-Step Proof (Theorem 38b)</text>
<text x="625" y="104" text-anchor="middle" fill="#71717a" font-size="8.2" class="mono-whisper">Why x ~ σ(x) inside N₁(F) violates λ = 1 on shared edge {z, σ(x)}</text>
