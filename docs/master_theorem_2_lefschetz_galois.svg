<text x="625" y="238" text-anchor="middle" fill="#854d0e" font-size="8.0" class="mono-whisper">shared edge {z, σ(x)}</text>
<text x="625" y="344" text-anchor="middle" fill="#18181b" font-size="11" class="math-label">Two common neighbors w₁ = x ≠ σ²(x) = w₂ of {z, σ(x)}  ⟹  violates λ = 1!</text>
<text x="625" y="362" text-anchor="middle" fill="#71717a" font-size="8" class="mono-whisper">Proved in Lean 4 without orbit matrices or prime assumptions (0 axioms)</text>
<text x="1055" y="88" text-anchor="middle" fill="#18181b" font-size="13.5" class="poetic-title">III · Galois Trace &amp; Divisibility Sieve</text>
<text x="1055" y="104" text-anchor="middle" fill="#71717a" font-size="8.2" class="mono-whisper">Gal(Q(ζ_r)/Q) locks Tr(σ|V₁), Tr(σ|V₂) ∈ Z</text>
<circle cx="872" cy="142.0" r="4.0" fill="#2f5d50"/>
<text x="886" y="138.0" fill="#18181b" font-size="9.2" class="mono-whisper">Universal Multiplicity Law (Thm 38c)</text>
<text x="886" y="151.0" fill="#2f5d50" font-size="8.6" class="mono-whisper">d · m₂ = θ₁ · n_orb + c_adj</text>
<text x="886" y="163.0" fill="#71717a" font-size="7.7" class="mono-whisper">holds across all 5 graphs d ∈ {3,7,9,21,63}</text>
<circle cx="872" cy="196.0" r="4.0" fill="#854d0e"/>
<text x="886" y="192.0" fill="#18181b" font-size="9.2" class="mono-whisper">Order p = 7 Closure (p7_fix1)</text>
<text x="886" y="205.0" fill="#854d0e" font-size="8.6" class="mono-whisper">Gal(Q(ζ₇)/Q) ⟹ Tr(B₁₂) = 0</text>
<text x="886" y="217.0" fill="#71717a" font-size="7.7" class="mono-whisper">5,209 Pure-RUP steps (0.82s) ⟹ 7 ∤ |Aut|</text>
<circle cx="872" cy="250.0" r="4.0" fill="#854d0e"/>
<text x="886" y="246.0" fill="#18181b" font-size="9.2" class="mono-whisper">Order p = 3 Mod-9 Law (Thm 33 &amp; 35)</text>
<text x="886" y="259.0" fill="#854d0e" font-size="8.6" class="mono-whisper">7·Tr(σ|V₁) = 3f + 3c₁ - 18 ⟹ 9 | f</text>
<text x="886" y="271.0" fill="#71717a" font-size="7.7" class="mono-whisper">unique F₂₁ kernel + p3_t1_fix33 ⟹ 3 ∤ |Aut|</text>
<circle cx="872" cy="304.0" r="4.0" fill="#18181b"/>
<text x="886" y="300.0" fill="#18181b" font-size="9.2" class="mono-whisper">Involutions p = 2 (18/19 Profiles)</text>
<text x="886" y="313.0" fill="#18181b" font-size="8.6" class="mono-whisper">E_flip(g) = b_x0 + Tr(B) = ∑_{z∈F} b_z</text>
<text x="886" y="325.0" fill="#71717a" font-size="7.7" class="mono-whisper">all 18 profiles with |Fix(g)| ≥ 3 UNSAT</text>
<text x="640" y="416" text-anchor="middle" fill="#71717a" font-size="8.5" class="mono-whisper">LEAN 4: odd_order_no_step_in_n1_structural (Thm 38b) · odd_order_galois_eigenvalue_multiplicity_law (Thm 38c) · order3_spectral_trace_divisibility_by_9 (Thm 33)</text>
