<text x="640" y="54" text-anchor="middle" fill="#71717a" font-size="9" class="mono-whisper">σ(z) = z ∧ z ~ x ∧ σ²(x) ≠ x  ⟹  x ≁ σ(x) (0 axioms)   ·   d·m₂ = θ₁·n_orb + c_adj   ·   ord(σ) = 3 ⟹ |Fix(σ)| ≡ 0 (mod 9)</text>
