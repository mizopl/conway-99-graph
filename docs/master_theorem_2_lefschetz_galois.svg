<text x="491.0" y="296.0" text-anchor="end" fill="#18181b" font-size="9.2" class="mono-whisper">x</text>
<text x="625.0" y="316.0" text-anchor="middle" fill="#18181b" font-size="9.2" class="mono-whisper">σ(x)</text>
<text x="759.0" y="296.0" text-anchor="start" fill="#18181b" font-size="9.2" class="mono-whisper">σ²(x) ≠ x</text>
<text x="562" y="303" text-anchor="middle" fill="#9f1239" font-size="7.8" class="mono-whisper">if x ~ σ(x)</text>
<text x="688" y="303" text-anchor="middle" fill="#9f1239" font-size="7.8" class="mono-whisper">then σ(x) ~ σ²(x)</text>
