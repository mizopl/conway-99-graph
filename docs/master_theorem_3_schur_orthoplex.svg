<text x="640" y="34" text-anchor="middle" fill="#18181b" font-size="18.5" class="poetic-title">Master Theorem III — Three-Block Schur–Fiber Decomposition, 6D Orthoplex β₆ &amp; Cherry-Free Collapse</text>
<text x="640" y="54" text-anchor="middle" fill="#71717a" font-size="9" class="mono-whisper">V₉₉ = V₃₉ ⊔ V₆₀   ·   (S,S): (3X̃ - J)(3X̃ - J)ᵀ = 81 I₁₂   ·   (S,R): A₆₀[xᵢ] ≅ 4K₂ ⊔ 2K₁   ·   (R,R): w₁₂ + x₁₂ + gx₁₂ ≤ 2</text>
